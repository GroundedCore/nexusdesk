name: agent-knowledge
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    network_mode: host
    restart: unless-stopped
    command: ["postgres", "-p", "55433", "-c", "listen_addresses=10.0.11.112", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: agent_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["./postgres:/var/lib/postgresql/data"]
    mem_limit: 1g
  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    network_mode: host
    restart: unless-stopped
    command: ["server", "/data", "--address", "10.0.11.112:19000", "--console-address", "10.0.11.112:19001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["./minio:/data"]
    mem_limit: 1g
  milvus:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.5.10
    network_mode: host
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - ./milvus:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./user.yaml:/milvus/configs/user.yaml:ro
    mem_limit: 4g
