name: Bug 报告
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填完整——信息越具体，越容易定位。
        ⚠️ **请勿粘贴 API Key、访问令牌、数据库密码或客户隐私数据**，日志请先脱敏。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么？期望是什么？
      placeholder: 例如：在会话工作台点击"创建工单"后，页面一直停留在加载状态，控制台报 500。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出可复现的最小步骤
      placeholder: |
        1. 启动 quickstart
        2. 进入 sample-support 会话
        3. 输入"帮我创建工单"
        4. 点击确认
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - quickstart（两容器，体验模式）
        - 生产部署（Docker Compose）
        - 本地开发（uvicorn + vite）
        - 其他（请在下方说明）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 镜像标签、release 版本或 commit SHA
      placeholder: 例如：v0.1.0 或 dd6e95c
    validations:
      required: false
  - type: textarea
    id: middleware
    attributes:
      label: 环境与中间件
      description: 操作系统、浏览器、数据库版本，以及是否启用了 Milvus / S3 / 外部 Parser
      placeholder: |
        例如：Windows Server 2022；Chrome 141；PostgreSQL 17；
        Milvus 未启用；外部 Parser 未配置
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 相关容器日志或浏览器控制台输出（**请先脱敏**）
      render: text
    validations:
      required: false
