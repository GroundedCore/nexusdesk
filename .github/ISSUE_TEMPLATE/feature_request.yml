name: 功能建议
description: 提出新功能、改进或设计取舍方面的建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出建议前，建议先说明**你遇到的实际场景**——从场景出发的取舍讨论比功能清单更容易落地。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么事情时遇到了这个需求？谁会用、用在什么环节？
      placeholder: 例如：我们把客服系统部署在客户内网，客户要求工单必须同步到他们自己的 ITSM 系统。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前的问题
      description: 现在是怎么解决的？哪里不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望它怎么工作？如果有替代方案也请一并说明。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有试过别的做法？为什么不行？
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围（可多选）
      options:
        - label: Agent 配置与执行
        - label: 知识库与检索
        - label: 模型接入
        - label: 业务工具
        - label: 人工协同与工单
        - label: 渠道与应用接入
        - label: 部署与运维
        - label: 文档
