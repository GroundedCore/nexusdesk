name: CD

# Deploys a released version of the quickstart stack to the server.
#
# Deployment red lines (branch-management spec §9):
#   - main/integration events (push, CI completion, etc.) NEVER trigger a deploy.
#   - Deploys are triggered ONLY by:
#       1. Publishing a GitHub Release (tag v*), or
#       2. Manually dispatching this workflow with an explicit version tag.
#   - The deployed artifact is built from the specified tag; mutable tags such
#     as `latest` are never used as a deploy source or pushed to registries.
#   - Production deploys require approval via the `production` GitHub
#     Environment (configure required reviewers in repo settings).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v0.2.0). Must be an existing v* tag."
        required: true
        type: string

# Never cancel an in-flight deploy; queue the next one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to GHCR with GITHUB_TOKEN

env:
  # Release events deploy the release tag; manual dispatch deploys the
  # version input. Both are validated as v* tags before anything runs.
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    # Production deploys go through the `production` Environment: required
    # reviewers must approve before this job starts. Environment-scoped
    # secrets (DEPLOY_HOST, DEPLOY_SSH_KEY, ...) should live there.
    environment: production
    env:
      IMAGE_TAG: ${{ env.VERSION }}
      # Loopback-only by default in compose; the server deployment opts into a
      # wider bind. Override with the NEXUSDESK_BIND repository variable.
      # NOTE: quickstart no longer injects an identity, so unauthenticated API
      # calls are rejected. Its sign-in password is still the public default, so
      # put real authentication in front (basic auth or an IP allowlist) when
      # binding beyond 127.0.0.1.
      NEXUSDESK_BIND: ${{ vars.NEXUSDESK_BIND || '0.0.0.0' }}
      # Addresses users actually type to reach the demo. The generated certificate
      # must cover them, otherwise a browser reports a name mismatch even after
      # ca.crt has been imported. Defaults to the deploy host, which is how the
      # server is reached; set the NEXUSDESK_TLS_HOSTS repository variable when the
      # addresses differ, and use a comma-separated list for more than one.
      NEXUSDESK_TLS_HOSTS: ${{ vars.NEXUSDESK_TLS_HOSTS || secrets.DEPLOY_HOST }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          # Mutable tags (latest, main, branch names, SHAs) are forbidden as
          # deploy inputs; only immutable release tags may be deployed.
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION '${VERSION}' is not a valid release tag (expected e.g. v0.2.0)."
            exit 1
          fi
          echo "Deploying version ${VERSION}"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          # Build the deployment artifact from the exact tagged code.
          ref: ${{ env.VERSION }}

      - name: Verify the checkout matches the tag
        shell: bash
        run: |
          git fetch --depth=1 origin tag "${VERSION}" --no-tags || true
          tag_sha="$(git rev-parse "${VERSION}^{commit}" 2>/dev/null || true)"
          head_sha="$(git rev-parse HEAD)"
          if [ -n "${tag_sha}" ] && [ "${tag_sha}" != "${head_sha}" ]; then
            echo "::error::Checked-out commit ${head_sha} does not match tag ${VERSION} (${tag_sha})."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Checked out ${VERSION} at ${head_sha}"

      - name: Compute GHCR namespace
        # GHCR requires a lowercase namespace.
        run: echo "GHCR_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push quickstart image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: quickstart
          # The quickstart account is public by design, so pre-fill the form.
          build-args: |
            VITE_PREFILL_LOGIN=true
          push: true
          # Only the immutable version tag is published; never `latest`.
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/nexusdesk-quickstart:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=quickstart
          cache-to: type=gha,mode=max,scope=quickstart

      - name: Login to Docker Hub
        id: dockerhub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image to Docker Hub
        id: mirror
        if: ${{ steps.dockerhub.outcome == 'success' }}
        continue-on-error: true
        # Registry-to-registry copy preserves the manifest and layer digests.
        run: |
          docker buildx imagetools create \
            -t "${DOCKERHUB_NAMESPACE}/nexusdesk-quickstart:${IMAGE_TAG}" \
            "ghcr.io/${GHCR_NAMESPACE}/nexusdesk-quickstart:${IMAGE_TAG}"

      - name: Select deployment registry
        # The deployment host can reach Docker Hub much faster than GHCR.
        # Mirror failures are non-fatal: fall back to the authenticated GHCR pull.
        run: |
          if [ "${{ steps.mirror.outcome }}" = "success" ]; then
            echo "NEXUSDESK_IMAGE_REGISTRY=${DOCKERHUB_NAMESPACE}/" >> "$GITHUB_ENV"
          else
            echo "NEXUSDESK_IMAGE_REGISTRY=ghcr.io/${GHCR_NAMESPACE}/" >> "$GITHUB_ENV"
          fi

      - name: Deploy to server
        env:
          GHCR_USER: ${{ github.actor }}
          # The workflow token can read the private package created by this run.
          # It is only forwarded to the deployment host for the duration of the job.
          GHCR_TOKEN: ${{ github.token }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,NEXUSDESK_IMAGE_REGISTRY,NEXUSDESK_BIND,NEXUSDESK_TLS_HOSTS,GHCR_NAMESPACE,GHCR_USER,GHCR_TOKEN
          # Keep headroom for a first pull on a slow server-to-registry link.
          command_timeout: 60m
          script: |
            set -e
            cd /home/nexus/nexusdesk
            export NEXUSDESK_VERSION="${IMAGE_TAG}"
            export NEXUSDESK_IMAGE_REGISTRY="${NEXUSDESK_IMAGE_REGISTRY}"
            export NEXUSDESK_BIND="${NEXUSDESK_BIND}"
            export NEXUSDESK_TLS_HOSTS="${NEXUSDESK_TLS_HOSTS}"
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            if ! docker compose -f deploy/quickstart/compose.yaml pull; then
              echo "::warning::Primary registry pull failed; retrying from GHCR."
              export NEXUSDESK_IMAGE_REGISTRY="ghcr.io/${GHCR_NAMESPACE}/"
              docker compose -f deploy/quickstart/compose.yaml pull
            fi
            # Recreates the app container on the new image; the container
            # bootstrap runs migrations before serving traffic. --wait fails
            # the deploy if the healthcheck does not pass in time.
            docker compose -f deploy/quickstart/compose.yaml up -d --wait --wait-timeout 300
            docker compose -f deploy/quickstart/compose.yaml ps
            docker image prune -f
            # Record the actually running version on the host for audit and
            # rollback reference.
            printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${IMAGE_TAG}" | tee -a /home/nexus/nexusdesk/.deployed-versions
            docker compose -f deploy/quickstart/compose.yaml exec -T app python /app/deploy/healthcheck.py quickstart

      - name: Record deployment
        if: always()
        shell: bash
        run: |
          {
            echo "### Deployment ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
            echo "- Version: \`${VERSION}\`"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Actor: ${{ github.actor }}"
            echo "- Result: ${{ job.status }}"
            echo "- Time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
