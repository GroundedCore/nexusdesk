name: CD

# Deploys the quickstart stack to the server after CI passes on main, or on
# manual dispatch. The image is built here and pushed to GHCR; the server
# pulls it from Docker Hub when mirroring is configured, otherwise falls back
# to GHCR. PostgreSQL still comes directly from Docker Hub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight deploy; queue the next one instead.
concurrency:
  group: deploy-quickstart
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to GHCR with GITHUB_TOKEN

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    # Repository-level secrets (Settings → Secrets and variables → Actions).
    # Add `environment: production` here if you later want environment-scoped
    # secrets or required-reviewer approval before deploys.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # For workflow_run, build the exact commit CI validated.
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Loopback-only by default in compose; the server deployment opts into a
      # wider bind. Override with the NEXUSDESK_BIND repository variable.
      # NOTE: quickstart no longer injects an identity, so unauthenticated API
      # calls are rejected. Its sign-in password is still the public default, so
      # put real authentication in front (basic auth or an IP allowlist) when
      # binding beyond 127.0.0.1.
      NEXUSDESK_BIND: ${{ vars.NEXUSDESK_BIND || '0.0.0.0' }}
      # Addresses users actually type to reach the demo. The generated certificate
      # must cover them, otherwise a browser reports a name mismatch even after
      # ca.crt has been imported. Defaults to the deploy host, which is how the
      # server is reached; set the NEXUSDESK_TLS_HOSTS repository variable when the
      # addresses differ, and use a comma-separated list for more than one.
      NEXUSDESK_TLS_HOSTS: ${{ vars.NEXUSDESK_TLS_HOSTS || secrets.DEPLOY_HOST }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute GHCR namespace
        # GHCR requires a lowercase namespace.
        run: echo "GHCR_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push quickstart image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: quickstart
          # The quickstart account is public by design, so pre-fill the form.
          build-args: |
            VITE_PREFILL_LOGIN=true
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/nexusdesk-quickstart:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/nexusdesk-quickstart:latest
          cache-from: type=gha,scope=quickstart
          cache-to: type=gha,mode=max,scope=quickstart

      - name: Login to Docker Hub
        id: dockerhub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image to Docker Hub
        id: mirror
        if: ${{ steps.dockerhub.outcome == 'success' }}
        continue-on-error: true
        # Registry-to-registry copy preserves the manifest and layer digests.
        run: |
          docker buildx imagetools create \
            -t "${DOCKERHUB_NAMESPACE}/nexusdesk-quickstart:${IMAGE_TAG}" \
            -t "${DOCKERHUB_NAMESPACE}/nexusdesk-quickstart:latest" \
            "ghcr.io/${GHCR_NAMESPACE}/nexusdesk-quickstart:${IMAGE_TAG}"

      - name: Select deployment registry
        # The deployment host can reach Docker Hub much faster than GHCR.
        # Mirror failures are non-fatal: fall back to the authenticated GHCR pull.
        run: |
          if [ "${{ steps.mirror.outcome }}" = "success" ]; then
            echo "NEXUSDESK_IMAGE_REGISTRY=${DOCKERHUB_NAMESPACE}/" >> "$GITHUB_ENV"
          else
            echo "NEXUSDESK_IMAGE_REGISTRY=ghcr.io/${GHCR_NAMESPACE}/" >> "$GITHUB_ENV"
          fi

      - name: Deploy to server
        env:
          GHCR_USER: ${{ github.actor }}
          # The workflow token can read the private package created by this run.
          # It is only forwarded to the deployment host for the duration of the job.
          GHCR_TOKEN: ${{ github.token }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,NEXUSDESK_IMAGE_REGISTRY,NEXUSDESK_BIND,NEXUSDESK_TLS_HOSTS,GHCR_USER,GHCR_TOKEN
          # Keep headroom for a first pull on a slow server-to-registry link.
          command_timeout: 60m
          script: |
            set -e
            cd /home/nexus/nexusdesk
            export NEXUSDESK_VERSION="${IMAGE_TAG}"
            export NEXUSDESK_IMAGE_REGISTRY="${NEXUSDESK_IMAGE_REGISTRY}"
            export NEXUSDESK_BIND="${NEXUSDESK_BIND}"
            export NEXUSDESK_TLS_HOSTS="${NEXUSDESK_TLS_HOSTS}"
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f deploy/quickstart/compose.yaml pull
            # Recreates the app container on the new image; the container
            # bootstrap runs migrations before serving traffic. --wait fails
            # the deploy if the healthcheck does not pass in time.
            docker compose -f deploy/quickstart/compose.yaml up -d --wait --wait-timeout 300
            docker compose -f deploy/quickstart/compose.yaml ps
            docker image prune -f
