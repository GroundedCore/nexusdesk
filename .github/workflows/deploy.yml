name: CD (test deploy)

# Deploys the CI-verified `integration` commit to the TEST server.
#
# Branch-management spec V2 (.agents/skills/groundedcoreai-dev-workflow/
# references/workflow-spec-v2.md), §5.2/§5.3/§5.4:
#   - Triggers ONLY when the CI workflow completes for a PUSH to `integration`
#     with conclusion `success` (workflow_run). PR checks, failed/cancelled
#     runs and other branches never deploy.
#   - Deploys the exact commit SHA the upstream CI verified — never the moving
#     tip of `integration`; `latest` is never used as an image tag.
#   - No manual approval, no git tags, no GitHub Releases.
#   - `main` updates, release tags and GitHub Releases never deploy anything.
#
# Credential isolation (spec V2 §5.4):
#   - workflow_run loads THIS file from the default branch, so code from an
#     unreviewed PR cannot alter the deploy logic.
#   - The build job receives no server credentials.
#   - Only the deploy job (GitHub Environment `testing`) sees the SSH secrets;
#     configure DEPLOY_HOST / DEPLOY_PORT / DEPLOY_USER / DEPLOY_SSH_KEY as
#     secrets of the `testing` environment (no required reviewers).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [integration]
  # Manual redeploy of a historical integration commit (spec V2 §5.3: keep the
  # ability to redeploy previously verified versions).
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-char commit SHA on integration to redeploy (must already be merged there)."
        required: true
        type: string

# Never cancel an in-flight deploy; queue the next one instead.
concurrency:
  group: deploy-testing
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to GHCR with GITHUB_TOKEN

jobs:
  guard:
    name: Validate deploy preconditions
    runs-on: ubuntu-latest
    env:
      WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WR_EVENT: ${{ github.event.workflow_run.event }}
      WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WR_HTML_URL: ${{ github.event.workflow_run.html_url }}
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      upstream_run_url: ${{ steps.check.outputs.upstream_run_url }}
    steps:
      - name: Check preconditions and resolve image tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "upstream_run_url=${WR_HTML_URL:-manual}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Deploy only when the upstream CI run was a push to `integration`
            # that concluded successfully. Anything else (PR checks, failures,
            # cancellations, other branches) must not deploy.
            if [ "${WR_EVENT}" != "push" ] || [ "${WR_BRANCH}" != "integration" ]; then
              echo "::notice::Upstream run is not a push to integration (event=${WR_EVENT}, branch=${WR_BRANCH}); skipping deploy."
              exit 0
            fi
            if [ "${WR_CONCLUSION}" != "success" ]; then
              echo "::notice::Upstream CI conclusion is '${WR_CONCLUSION}'; skipping deploy."
              exit 0
            fi
            SHA="${WR_HEAD_SHA}"
          else
            SHA="${{ inputs.commit_sha }}"
          fi

          # Only immutable commit SHAs may be deployed; branch names and
          # mutable tags such as `latest` are rejected.
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Ref '${SHA}' is not a full 40-char commit SHA. Refusing to deploy."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual redeploys must target a commit already merged into
            # integration (i.e. an ancestor of, or equal to, its tip).
            status="$(curl -sf "https://api.github.com/repos/${{ github.repository }}/compare/${SHA}...integration" | jq -r .status)"
            case "${status}" in
              ahead|identical) ;;
              *) echo "::error::Commit ${SHA} is not contained in integration (compare status: ${status})."; exit 1 ;;
            esac
          fi

          IMAGE_TAG="$(echo "${SHA}" | cut -c1-12)"
          echo "Deploying commit ${SHA} (image tag ${IMAGE_TAG})"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push image
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # Credential isolation: this job must NOT receive SSH/deploy secrets.
    env:
      COMMIT_SHA: ${{ needs.guard.outputs.commit_sha }}
      IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    outputs:
      image_registry: ${{ steps.registry.outputs.image_registry }}
      ghcr_namespace: ${{ steps.ghcr.outputs.ghcr_namespace }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          # Build the deployment artifact from the exact commit the upstream
          # CI verified, not from the moving tip of `integration`.
          ref: ${{ needs.guard.outputs.commit_sha }}

      - name: Compute GHCR namespace
        id: ghcr
        # GHCR requires a lowercase namespace.
        run: echo "ghcr_namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push quickstart image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: quickstart
          # The quickstart account is public by design, so pre-fill the form.
          build-args: |
            VITE_PREFILL_LOGIN=true
          push: true
          # Only the immutable commit-SHA tag is published; never `latest`.
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.ghcr_namespace }}/nexusdesk-quickstart:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=quickstart
          cache-to: type=gha,mode=max,scope=quickstart

      - name: Login to Docker Hub
        id: dockerhub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image to Docker Hub
        id: mirror
        if: ${{ steps.dockerhub.outcome == 'success' }}
        continue-on-error: true
        # Registry-to-registry copy preserves the manifest and layer digests.
        run: |
          docker buildx imagetools create \
            -t "${DOCKERHUB_NAMESPACE}/nexusdesk-quickstart:${IMAGE_TAG}" \
            "ghcr.io/${{ steps.ghcr.outputs.ghcr_namespace }}/nexusdesk-quickstart:${IMAGE_TAG}"

      - name: Select deployment registry
        id: registry
        # The deployment host can reach Docker Hub much faster than GHCR.
        # Mirror failures are non-fatal: fall back to the authenticated GHCR pull.
        run: |
          if [ "${{ steps.mirror.outcome }}" = "success" ]; then
            echo "image_registry=${DOCKERHUB_NAMESPACE}/" >> "$GITHUB_OUTPUT"
          else
            echo "image_registry=ghcr.io/${{ steps.ghcr.outputs.ghcr_namespace }}/" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to test server
    needs: [guard, build]
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # Test-server deploys run without manual approval (spec V2 §5.2), but the
    # `testing` Environment scopes the SSH secrets to this job only. Create the
    # environment in repo settings WITHOUT required reviewers and move
    # DEPLOY_HOST / DEPLOY_PORT / DEPLOY_USER / DEPLOY_SSH_KEY into it.
    environment: testing
    env:
      # Test server access must be restricted (spec V2 §6): VPN, IP allowlist
      # or a real authentication layer in front. The quickstart sign-in
      # password is a public default — do not expose the port unprotected.
      NEXUSDESK_BIND: ${{ vars.NEXUSDESK_BIND || '0.0.0.0' }}
      # Addresses users actually type to reach the test deployment. The
      # generated certificate must cover them; set the NEXUSDESK_TLS_HOSTS
      # repository variable (comma-separated) when they differ from the host.
      NEXUSDESK_TLS_HOSTS: ${{ vars.NEXUSDESK_TLS_HOSTS || secrets.DEPLOY_HOST }}
      COMMIT_SHA: ${{ needs.guard.outputs.commit_sha }}
      IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
      IMAGE_REGISTRY: ${{ needs.build.outputs.image_registry }}
      GHCR_NAMESPACE: ${{ needs.build.outputs.ghcr_namespace }}
    steps:
      - name: Deploy to test server
        env:
          GHCR_USER: ${{ github.actor }}
          # The workflow token can read the private package created by this run.
          # It is only forwarded to the deployment host for the duration of the job.
          GHCR_TOKEN: ${{ github.token }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_REGISTRY,NEXUSDESK_BIND,NEXUSDESK_TLS_HOSTS,GHCR_NAMESPACE,GHCR_USER,GHCR_TOKEN,COMMIT_SHA
          # Keep headroom for a first pull on a slow server-to-registry link.
          command_timeout: 60m
          script: |
            set -e
            cd /home/nexus/nexusdesk
            export NEXUSDESK_VERSION="${IMAGE_TAG}"
            export NEXUSDESK_IMAGE_REGISTRY="${IMAGE_REGISTRY}"
            export NEXUSDESK_BIND="${NEXUSDESK_BIND}"
            export NEXUSDESK_TLS_HOSTS="${NEXUSDESK_TLS_HOSTS}"
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            if ! docker compose -f deploy/quickstart/compose.yaml pull; then
              echo "::warning::Primary registry pull failed; retrying from GHCR."
              export NEXUSDESK_IMAGE_REGISTRY="ghcr.io/${GHCR_NAMESPACE}/"
              docker compose -f deploy/quickstart/compose.yaml pull
            fi
            # Recreates the app container on the new image; the container
            # bootstrap runs migrations before serving traffic. --wait fails
            # the deploy if the healthcheck does not pass in time.
            docker compose -f deploy/quickstart/compose.yaml up -d --wait --wait-timeout 300
            docker compose -f deploy/quickstart/compose.yaml ps
            docker image prune -f
            # Record the actually running commit on the host for audit and
            # rollback reference (spec V2 §5.3/§6).
            printf '%s %s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${COMMIT_SHA}" "${IMAGE_TAG}" | tee -a /home/nexus/nexusdesk/.deployed-versions
            docker compose -f deploy/quickstart/compose.yaml exec -T app python /app/deploy/healthcheck.py quickstart

      - name: Record deployment
        if: always()
        shell: bash
        run: |
          {
            echo "### Test deployment ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
            echo "- Commit: \`${{ needs.guard.outputs.commit_sha }}\`"
            echo "- Image tag: \`${{ needs.guard.outputs.image_tag }}\`"
            echo "- Upstream CI: ${{ needs.guard.outputs.upstream_run_url }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Actor: ${{ github.actor }}"
            echo "- Result: ${{ job.status }}"
            echo "- Time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
