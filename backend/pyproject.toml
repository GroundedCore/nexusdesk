[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-agent-platform"
version = "0.1.0"
description = "Modular ReAct customer service agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.2",
    "sqlalchemy>=2.0.54",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "PyYAML>=6,<7",
    "boto3>=1.40,<2",
    "cryptography>=46,<47",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "openpyxl>=3.1,<4",
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
 "httpx>=0.27,<1",
 "ruff>=0.9,<1",
 "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: integration tests requiring TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"
